name: 缺陷报告
description: 可复现的规则、画面或运行问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: 实际表现
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期表现
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
  - type: textarea
    id: evidence
    attributes:
      label: 日志、截图或录像
