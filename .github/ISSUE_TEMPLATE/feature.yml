name: 功能任务
description: 新玩法、系统或工程能力
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 说明用户最终能完成什么。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 列出本任务包含和不包含的内容。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可复现、可测试的条件描述完成状态。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与素材
      description: 规则、UI、音频、接口或其他任务依赖。
